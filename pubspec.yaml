name: yue2_studio
description: "YuE2 Studio: unofficial macOS client for the YuE2 open music model."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  slang: ^4.0.0
  slang_flutter: ^4.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - engine/sidecar.py
    - engine/fetch.py
    - engine/sheetsage_wrap.py
    - engine/manifests/
    - assets/uv/
